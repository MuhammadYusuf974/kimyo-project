<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Химия 8 класс</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#020617;color:white}

/* HEADER */
header{
  text-align:center;
  padding:40px;
  font-size:50px;
  background:#0f172a;
  border-bottom:4px solid #3b82f6;
}

/* MENU */
.menu{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:20px;
}

.menu button{
  font-size:22px;
  padding:15px 30px;
  border:none;
  border-radius:15px;
  background:#1e293b;
  color:white;
  cursor:pointer;
}

.menu button:hover{
  background:#3b82f6;
}

/* SCREEN */
.screen{display:none;text-align:center;padding:30px;}
.active{display:block;}

h2{font-size:40px;margin-bottom:20px;}

/* QUIZ */
.question{
  font-size:32px;
  margin-bottom:20px;
}

.answer{
  display:block;
  width:80%;
  margin:10px auto;
  padding:15px;
  font-size:20px;
  border:none;
  border-radius:10px;
  background:#1e293b;
  color:white;
  cursor:pointer;
}

.answer:hover{
  background:#3b82f6;
}

.progress{
  width:80%;
  height:15px;
  background:#1e293b;
  margin:15px auto;
  border-radius:10px;
}

.bar{
  height:100%;
  width:0%;
  background:#22c55e;
  border-radius:10px;
}
</style></head><body><header>⚗️ ХИМИЯ 8 КЛАСС</header><div class="menu">
<button onclick="show('home')">Главная</button>
<button onclick="show('quiz')">Тест</button>
</div><!-- HOME --><div id="home" class="screen active">
<h2>Добро пожаловать</h2>
<p>Начни тест по химии</p>
</div><!-- QUIZ --><div id="quiz" class="screen">
<h2>Тест</h2><div class="progress">
  <div class="bar" id="bar"></div>
</div><div class="question" id="q"></div>
<div id="answers"></div></div><script>

/* NAV */
function show(id){
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

const questions = [
{q:"Что такое атом?",a:["Молекула","Частица вещества","Газ","Планета"],c:1},
{q:"H2O это?",a:["Кислород","Вода","Металл","Соль"],c:1},
{q:"NaCl это?",a:["Сахар","Соль","Вода","Газ"],c:1},
{q:"CO2 это?",a:["Газ","Металл","Жидкость","Соль"],c:0},
{q:"Fe это?",a:["Золото","Железо","Серебро","Газ"],c:1},
{q:"O это?",a:["Кислород","Водород","Азот","Железо"],c:0},
{q:"N это?",a:["Азот","Кислород","Водород","Металл"],c:0},
{q:"H это?",a:["Водород","Кислород","Азот","Железо"],c:0},
{q:"pH 7 это?",a:["Кислота","Щелочь","Нейтрально","Газ"],c:2},
{q:"CH4 это?",a:["Метан","Вода","Соль","Газ"],c:0},

{q:"Ca это?",a:["Кальций","Газ","Соль","Жидкость"],c:0},
{q:"Mg это?",a:["Магний","Железо","Газ","Вода"],c:0},
{q:"Zn это?",a:["Цинк","Газ","Соль","Вода"],c:0},
{q:"Cu это?",a:["Медь","Газ","Кислород","Вода"],c:0},
{q:"Ag это?",a:["Серебро","Золото","Газ","Вода"],c:0},
{q:"Au это?",a:["Золото","Серебро","Газ","Вода"],c:0},
{q:"Pb это?",a:["Свинец","Газ","Металл","Вода"],c:0},
{q:"K это?",a:["Калий","Азот","Кислород","Железо"],c:0},
{q:"Cl это?",a:["Хлор","Кислород","Азот","Железо"],c:0},
{q:"He это?",a:["Гелий","Газ","Вода","Металл"],c:0},

{q:"O2 это?",a:["Газ","Жидкость","Металл","Соль"],c:0},
{q:"CO это?",a:["Газ","Металл","Вода","Соль"],c:0},
{q:"HCl это?",a:["Кислота","Газ","Металл","Соль"],c:0},
{q:"Na это?",a:["Натрий","Газ","Вода","Соль"],c:0},
{q:"Al это?",a:["Алюминий","Газ","Кислород","Вода"],c:0},
{q:"Si это?",a:["Кремний","Газ","Соль","Вода"],c:0},
{q:"P это?",a:["Фосфор","Газ","Металл","Вода"],c:0},
{q:"S это?",a:["Сера","Газ","Металл","Вода"],c:0},
{q:"Br это?",a:["Бром","Газ","Металл","Вода"],c:0},
{q:"I это?",a:["Йод","Газ","Металл","Вода"],c:0},

{q:"Какой газ нужен для дыхания?",a:["Кислород","Азот","CO2","Гелий"],c:0},
{q:"Какой газ выдыхаем?",a:["CO2","O2","H2","He"],c:0},
{q:"Вода это?",a:["Жидкость","Газ","Металл","Соль"],c:0},
{q:"Соль растворяется в воде?",a:["Да","Нет","Иногда","Никогда"],c:0},
{q:"Железо ржавеет?",a:["Да","Нет","Иногда","Никогда"],c:0},
{q:"Огонь это?",a:["Реакция","Вода","Газ","Металл"],c:0},
{q:"Лёд это?",a:["Твердый","Жидкость","Газ","Металл"],c:0},
{q:"Пар это?",a:["Газ","Жидкость","Твердый","Металл"],c:0}
];

/* RANDOM */
questions.sort(()=>Math.random()-0.5);

let i = 0;
let score = 0;
let lock = false;

/* LOAD */
function load(){
 lock = false;

 let current = questions[i];
 document.getElementById("q").innerText = current.q;

 let html = "";
 current.a.forEach((ans,index)=>{
  html += `<button class="answer" onclick="check(${index})">${ans}</button>`;
 });

 document.getElementById("answers").innerHTML = html;
}

/* CHECK */
function check(index){
 if(lock) return;
 lock = true;

 if(index === questions[i].c){
  score++;
 }

 setTimeout(next,400);
}

/* NEXT */
function next(){
 i++;

 document.getElementById("bar").style.width = (i / questions.length) * 100 + "%";

 if(i < questions.length){
  load();
 }else{
  document.getElementById("q").innerText = "Тест закончен!";
  document.getElementById("answers").innerHTML =
  "<h3 style='font-size:30px'>Результат: "+score+" / "+questions.length+"</h3>";
 }
}

/* START */
load();

</script></body>
</html>
